name: Build and push to ECR

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 761885676921.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: dataeng/kms-vault-operator

jobs:
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      - name: Verify eMudhra roots absent
        run: |
          docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          container_id=$(docker create ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }})
          docker export "$container_id" | tar -x -O etc/ssl/certs/ca-certificates.crt \
            | openssl storeutl -noout -text -certs /dev/stdin \
            | grep -E "emSign ECC Root CA - G3|AAA Certificate Services" \
            && echo "FAIL: vulnerable roots still present" && docker rm "$container_id" && exit 1 \
            || echo "PASS: no eMudhra roots found"
          docker rm "$container_id"
